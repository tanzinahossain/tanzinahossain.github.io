<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title %}{{ page.title }} · {% endif %}Tanzina Hossain</title>
<meta name="description" content="{{ page.description | default: site.description }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}?v={{ site.time | date: '%s' }}">
</head>
<body>
{% include header.html %}
{{ content }}
{% include footer.html %}

<script>
/* cite toggles */
document.addEventListener("click", function(e){
  var b = e.target.closest("[data-cite-toggle]");
  if(!b) return;
  var box = document.getElementById(b.getAttribute("data-cite-toggle"));
  if(!box) return;
  var show = box.hidden;
  box.hidden = !show;
  b.classList.toggle("open", show);
  b.textContent = show ? "Hide" : "Cite";
});

/* copy citation text (legacy single-block copy, still used elsewhere) */
document.addEventListener("click", function(e){
  var b = e.target.closest("[data-copy]");
  if(!b) return;
  var el = document.getElementById(b.getAttribute("data-copy"));
  if(!el) return;
  var done = function(msg){ var o = b.textContent; b.textContent = msg; setTimeout(function(){ b.textContent = o; }, 1600); };
  if(navigator.clipboard){ navigator.clipboard.writeText(el.textContent).then(function(){ done("Copied"); }, function(){ done("Select & copy"); }); }
  else { done("Select & copy"); }
});

/* cite tab switching (APA / BibTeX) */
document.addEventListener("click", function(e){
  var b = e.target.closest("[data-cite-tab]");
  if(!b) return;
  var group = b.closest(".cite-tabs");
  var content = group.nextElementSibling;
  Array.prototype.forEach.call(group.querySelectorAll(".cite-tab"), function(t){ t.classList.remove("active"); });
  b.classList.add("active");
  Array.prototype.forEach.call(content.querySelectorAll(".cite-format"), function(p){ p.hidden = true; });
  var target = document.getElementById(b.getAttribute("data-cite-tab"));
  if(target) target.hidden = false;
});

/* copy whichever cite format tab is currently visible */
document.addEventListener("click", function(e){
  var b = e.target.closest("[data-copy-active]");
  if(!b) return;
  var box = document.getElementById(b.getAttribute("data-copy-active"));
  if(!box) return;
  var visible = box.querySelector(".cite-format:not([hidden])");
  if(!visible) return;
  var done = function(msg){ var o = b.textContent; b.textContent = msg; setTimeout(function(){ b.textContent = o; }, 1600); };
  if(navigator.clipboard){ navigator.clipboard.writeText(visible.textContent).then(function(){ done("Copied"); }, function(){ done("Select & copy"); }); }
  else { done("Select & copy"); }
});
</script>
</body>
</html>
